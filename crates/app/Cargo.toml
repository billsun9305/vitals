[package]
name = "vitals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "vitals"
path = "src/lib.rs"

[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
vitals-core.workspace = true
serde_json.workspace = true
clap.workspace = true
tiny_http.workspace = true
include_dir = "0.7"
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl",
  "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSApplication", "NSFont",
  "NSColor", "NSWorkspace", "NSGraphics", "NSBezierPath", "NSGraphicsContext",
] }

[dev-dependencies]
serde_json.workspace = true
