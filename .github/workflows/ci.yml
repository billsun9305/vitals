name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test · bundle
    # Apple Silicon only: the sampler reads IOReport, which exists nowhere
    # else, and the tray is AppKit. GitHub's macos-15 runners are arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The binary embeds dashboard/dist at compile time (`include_dir!`),
      # so the page is built before anything in Rust is.
      - name: Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run build

      # rust-toolchain.toml selects stable + the arm64 target; rustup honours it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --examples -- -D warnings

      # The runner is a virtual machine: Apple Silicon underneath, but with
      # no IOReport CPU channels, so `macmon::Sampler::new` fails there. Tests
      # that sample real hardware begin with `vitals_core::skip_without_hardware!`
      # and return early instead of failing; everything pure still runs.
      # `--nocapture` puts their `skipped:` lines in this log, so what did not
      # run here is on the record rather than counted as a pass in silence.
      - name: Test
        run: cargo test --workspace -- --nocapture

      # The release script is never run by CI, but a broken one is found
      # here rather than on tag day: the dry run applies its edits to copies
      # and prints the diff, and the notes extractor must find the
      # Unreleased section. Both must print something.
      - name: Release script dry run
        run: |
          scripts/release.sh --dry-run 9.9.9 | tee /dev/stderr | grep -q '9\.9\.9'
          scripts/changelog-section.sh Unreleased | grep -q .

      - name: Bundle
        run: make bundle

      - uses: actions/upload-artifact@v4
        with:
          name: Vitals.app
          path: dist/Vitals.app
          if-no-files-found: error
